<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vita, cucina paesana</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header class="hero"><p class="eyebrow">Cucina paesana</p><h1>Vita</h1><p class="subtitle">Cucina paesana</p><a class="button" href="https://www.google.com/maps/place/Vita,+cucina+paesana/@37.1009939,15.1187175,17z/" target="_blank" rel="noopener">Apri su Google Maps</a></header><section id="menu" class="menu"><h2>Menu</h2><div id="menu-content"><p>Menu e prezzi da completare.</p></div></section><section class="info-grid"><article><h2>Orari</h2><p id="orari">Da definire.</p></article><article><h2>Contatti</h2><p id="contatti">Da definire.</p></article></section></main><script>fetch('menu.json').then(r=>r.json()).then(data=>{document.getElementById('menu-content').innerHTML=data.categorie.map(c=>`<section class="category"><h3>${c.nome}</h3>${c.prodotti.map(p=>`<div class="item"><span>${p.nome}</span><span>${p.prezzo||''}</span></div>`).join('')}</section>`).join('');document.getElementById('orari').textContent=data.orari;document.getElementById('contatti').textContent=data.contatti}).catch(()=>{});</script></body></html>
